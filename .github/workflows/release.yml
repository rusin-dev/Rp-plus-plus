name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: rp-windows.exe
          - os: ubuntu-latest
            asset_name: rp-linux
          - os: macos-latest
            asset_name: rp-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with Nuitka
        run: python scripts/build_exe.py

      - name: Rename artifact
        shell: bash
        run: |
          src="dist/rp"
          [ -f "dist/rp.exe" ] && src="dist/rp.exe"
          [ -f "dist/rp.bin" ] && src="dist/rp.bin"
          mv "$src" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

  release-preview:
    name: Create Pre-release (source only)
    needs: test
    if: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "Alpha/Beta 预发布：仅源码快照，不含二进制构建产物。"
