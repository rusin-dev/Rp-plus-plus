name: 🐛 Bug 报告
description: 提交一个问题或缺陷，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题！提交前请先搜索 [Issues](https://github.com/search?q=repo%3Amian-dev%2Frp--your-programming-co-pilot+is%3Aissue) 确认是否已存在相同问题。

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 你使用的版本或 git commit（可用 `git rev-parse --short HEAD` 查看）
      placeholder: 例如 0.1.0 或 abc1234
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python 版本
      description: 运行 `python --version` 查看
      placeholder: 例如 3.11.8
    validations:
      required: false

  - type: dropdown
    id: install_method
    attributes:
      label: 运行方式
      description: 你是如何安装 / 运行本项目的
      options:
        - 源码运行（python -m src.main）
        - pip install -e . 后使用 rp 命令
        - Nuitka 打包的可执行程序
        - 其他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 工作模式
      description: 出现问题时使用的工作模式
      options:
        - auto（自动规划并实现）
        - plan（仅规划）
        - build（直接实现）
        - 不确定
    validations:
      required: false

  - type: input
    id: provider_model
    attributes:
      label: 供应商 / 模型
      description: 出现问题时使用的供应商与模型（可在交互模式输入 `/connect`、`/models` 查看）
      placeholder: 例如 deepseek / deepseek-chat
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 请尽可能给出可复现的最小步骤或命令
      placeholder: |
        1. 运行 ...
        2. 输入 ...
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误输出
      description: 终端输出或 `log/` 目录下的日志内容（请脱敏，不要粘贴 API Key）
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何其他有帮助的上下文，例如截图、配置摘要等
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues，确认没有重复的问题
          required: true
        - label: 我没有在日志或截图中粘贴 API Key 等敏感信息
          required: true
