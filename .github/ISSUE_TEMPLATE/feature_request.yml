name: ✨ 功能请求 (Feature Request)
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为项目提出建议！请先搜索 [Issues](https://github.com/search?q=repo%3Amian-dev%2Frp--your-programming-co-pilot+is%3Aissue) 确认是否已有类似提议。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述该功能要解决的痛点或场景（例如「当我……的时候，我希望……」）
      placeholder: 这个功能与某个问题相关吗？请清晰描述
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何实现，期望看到怎样的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案或现有的临时解决办法
    validations:
      required: false

  - type: checkboxes
    id: area
    attributes:
      label: 涉及模块
      description: 该功能大致会涉及哪些部分（可多选）
      options:
        - label: core（基础设施：日志 / 事件总线 / 提示词 / 会话）
        - label: api（能力：客户端 / 工具 / 子 Agent）
        - label: ui（表现：TUI / 输入 / 面板）
        - label: 提示词与数据（src/data）
        - label: 文档 / 工作流
        - label: 不确定
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 其他相关信息、截图或参考资料
    validations:
      required: false
